<!DOCTYPE html>

<head>

    <style>

<body>
    <h1>ES% vs ES6 - czy wyniki są identyczne?</h1>
    <p>Kolumna <strong>ES5</strong> to wzorzec - jest gotowa od początku. Wiersze w kolumnie <strong>ES6</strong>

    <table>
        <thead>
            <tr>
                <th>Co sprawdzamy</th>

                <th>ES6</th>

    <script type="module">
